name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  mypy:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]" mypy
      - run: mypy

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    # The package carries findings from before ruff was adopted; they are
    # being reduced release by release. Until they are gone this job
    # reports them (as annotations) without failing: compare a change
    # against main instead. Drop --exit-zero once main is clean.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.3"
          args: "check nikobus_connect tests --output-format=github --exit-zero"
